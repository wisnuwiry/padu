onboarding.slide2_item3_title: Tinjau dan Putar Kembali Dengan Git
onboarding.slide2_item3_desc: Periksa perubahan berkas dan kembali ke titik sebelumnya dalam tugas saat diperlukan.
onboarding.slide3_badge: Mulai Sekarang
