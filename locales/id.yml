onboarding.slide3_item1_title: Buka Folder Proyek
onboarding.slide3_item1_desc: Tambahkan repositori Git atau folder ruang kerja yang ada untuk mulai berkolaborasi.
onboarding.slide3_item2_title: Scratchpad Cepat
onboarding.slide3_item2_desc: Mulai seketika tanpa proyek untuk pertanyaan singkat, skrip, dan pembuatan purwarupa.
onboarding.slide3_item3_title: Ganti Model Kapan Saja
onboarding.slide3_item3_desc: Pilih model, sesuaikan upaya penalaran, dan ganti penyedia kapan saja dengan Cmd/Ctrl + /.
