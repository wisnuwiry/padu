[package]
name = "padu-mcp"
version = "0.1.0"
edition = "2024"
description = "The MCP server Padu answers as: the tools an agent works a project through"
license = "GPL-3.0-only"
keywords = ["mcp", "agents", "tools", "padu"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
padu-prompts = { path = "../padu-prompts" }
regex = "1"
tokio = { version = "1", optional = true, features = ["net", "process", "rt-multi-thread", "sync", "time"] }

[features]
default = ["http"]
http = ["dep:axum", "dep:tokio"]
