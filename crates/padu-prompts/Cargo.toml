description = "Shared agent instructions and built-in resources for Padu"
license = "GPL-3.0-only"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "=1.0.1", default-features = false, features = ["deserialize"] }
