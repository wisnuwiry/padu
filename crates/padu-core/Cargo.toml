[package]
name = "padu-core"
version = "0.1.2"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for Padu"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_auth_methods"] }
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
ignore = "0.4"
nucleo-matcher = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
rust-i18n = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# Pinned at 1.0.x: `padu-mermaid` (via merman) pins `serde-saphyr =1.0.0` and
# `granit-parser =1.0.0` exactly, and cargo unifies same-major versions into
# one — so anything newer than 1.0.x breaks workspace resolution. The only
# use is basic frontmatter `from_str`, which is unchanged since 1.0.0.
serde-saphyr = { version = "=1.0.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
sha2 = "0.11"
smol = "2"
subtle = "2"
toml = "1.1"
trash = "5.2.6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
padu-protocol = { path = "../padu-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[dev-dependencies]
padu-client = { path = "../padu-client" }
