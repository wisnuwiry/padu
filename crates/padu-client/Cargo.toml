[package]
name = "padu-client"
version = "0.1.2"
edition = "2024"
description = "Rust client and daemon process supervisor for Padu"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
async-lock = "3"
async-trait = "0.1"
base64 = "0.22"
crossbeam-channel = "0.5"
dirs = "6.0"
futures-lite = "2"
parking_lot = "0.12"
nucleo-matcher = "0.3"
qrencode = { version = "0.14", features = ["svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
thiserror = "2"
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-native-roots",
] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
which = "7"
padu-protocol = { path = "../padu-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
