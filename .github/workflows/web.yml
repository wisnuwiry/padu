name: Client & Web checks

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/web/**"
      - "apps/mobile/**"
      - "apps/landing/**"
      - "crates/padu-protocol/**"
      - "themes.json"
      - "scripts/generate-themes.ts"
      - "Cargo.lock"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/web/**"
      - "apps/mobile/**"
      - "apps/landing/**"
      - "crates/padu-protocol/**"
      - "themes.json"
      - "scripts/generate-themes.ts"
      - "Cargo.lock"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-themes:
    name: Protocol & Themes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run sccache-action
        uses: mozilla/sccache-action@v0.0.11

      - name: Cache Cargo registry and git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: protocol-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            protocol-rust-1.96.0-cargo-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check wire protocol synchronization
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: bun run protocol:check

      - name: Check theme synchronization
        run: bun run theme:check

  client-package:
    name: Client Package (@padu/client)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck @padu/client
        run: bun run --filter @padu/client check

      - name: Test @padu/client
        run: bun run --filter @padu/client test

  web-app:
    name: Web App (@padu/web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web app
        run: bun run web:typecheck

      - name: Test web app
        run: bun run web:test

      - name: Build web app
        run: bun run web:build

  landing-app:
    name: Website (@padu/landing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck landing app
        run: bun run landing:typecheck

      - name: Test landing app
        run: bun run landing:test

      - name: Build landing app
        run: bun run landing:build

  mobile-app:
    name: Mobile App (@padu/mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck mobile app
        run: bun run mobile:typecheck

      - name: Test mobile app
        run: bun run mobile:test